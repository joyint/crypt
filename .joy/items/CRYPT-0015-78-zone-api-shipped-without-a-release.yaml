description: 'The rework gave joy-crypt the sealed-chat zone API (decrypt_blob, encrypt_blob_with_nonce, ZoneKey) but crypt was never released, so crates.io still serves the pre-rework code as 0.1.1. Publishing joy-chat 0.20.0 fails verification against it. Resolution: release crypt as 0.2.0 (joy-crypt and joy-token in step; joy-token now carries the exact-version joy-crypt dependency so the textual bump moves everything together) and publish both crates.'
