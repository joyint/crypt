  text: 'Proposed edits to the Outline doc ''Crypt - Selective Encryption for Joy'' (left to the operator: it is the authored vision doc and the MCP update would replace whole content): (1) Section ''AI Automation: Job-bound grants'': jobs are now Joy items at .joy/jobs/<ACRONYM>-JOB-xxxx-<hash>.yaml, plain YAML, NO crypt: block and no key material in the job file; the wrapped zone key attaches to the platform-held attempt/session context created when an attempt starts (wrap against the attempt''s session pubkey, as the doc already sketches). Validity stays state-based: assignee + job status in-progress + capability. (2) Replace the JOB-0001 YAML example with a job item (scope list, budget, attempts). (3) Replace ''joy job ls'' with ''joy ls -J''. (4) The wrap-location table row ''AI Automation -> Job record'' becomes ''attempt context (platform-held), never the job YAML''. (5) Cost reporting: tokens/cost land as attempt entries on the job item, not on a separate job record. Ref: JOY-01FE-37.'
