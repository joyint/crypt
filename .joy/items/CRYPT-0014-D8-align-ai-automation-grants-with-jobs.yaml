description: 'Jobs are now Joy items in .joy/jobs/ (plain YAML, no key material); execution loops are attempts on the job. Update the Crypt vision/docs: the Job-bound wrap (ADR-038 track) attaches to the platform-held attempt/session context instead of a crypt: block in the job file; validity stays state-based on the job lifecycle. Update the .joy/jobs/<ITEM-ID>/JOB-XXXX.yaml path example and joy job ls references to the item grammar (joy ls -J).'
