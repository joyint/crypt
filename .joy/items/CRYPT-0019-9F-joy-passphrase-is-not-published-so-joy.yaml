description: |-
  CRYPT-0016-B0 added the crate joy-passphrase, and joy-core and joy-cli depend on it since JOY-02CC-46 (version "0" and a path). The crate is not on crates.io (asked of the crates.io API on 2026-10-13), and nothing here would put it there:
  - the publish-crates recipe in the justfile uploads joy-crypt and joy-token only;
  - release.version-files names those two only, and the crate stands at 0.1.0 while the project is at 0.2.0. joy release bump replaces the quoted current version in the listed files, so even listed it would never move, and a changed crate would never be uploaded again.

  A release would publish this repository and then fail at 'cargo publish -p joy-core' in joy, with joy's tag already pushed: the shape of JOY-02A4-89 (joy-telemetry).

  To do: the crate is uploaded with the other two; it carries the project's version and is in release.version-files, so it moves with every release. Lock files that record the crate's version follow: this repository's here, joy's in joy (platform's agent image builds joy-cli with --locked).
